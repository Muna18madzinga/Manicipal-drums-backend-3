# nginx front for QGIS Server FCGI — exposes a single OGC endpoint on :8080.
#
# The backend OGC bridge calls QGIS_SERVER_URL + /wms, /wfs, /wmts, /ogc.
# QGIS Server serves ALL OGC services from one FCGI socket and decides which
# by the SERVICE= query param, so every one of those paths routes to the same
# upstream. QGIS_PROJECT_FILE names the default project so requests need no
# MAP= param (which is exactly what the bridge assumes).

upstream qgis {
    server qgis-server:9993;
}

server {
    listen 8080;
    server_name _;

    # Health probe used by scripts/verify-qgis-server.js and /api/ogc/health.
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # All OGC service paths -> QGIS Server FCGI. `location /` catches /wms,
    # /wfs, /wmts, /ogc and the bare root alike.
    location / {
        fastcgi_pass qgis;
        include fastcgi_params;
        fastcgi_param  QGIS_PROJECT_FILE  /io/data/vungu-project.qgs;
        fastcgi_param  QGIS_SERVER_LOG_LEVEL 1;
        # libpq resolves the layers' service='vungu' datasource through this.
        # It MUST be a fastcgi_param, not just a container env var: QGIS
        # Server's FCGI worker takes its environment from the request params,
        # so a plain Docker env var never reaches libpq ("definition of
        # service vungu not found").
        fastcgi_param  PGSERVICEFILE      /io/data/pg_service.docker.conf;
        # QGIS Server reads the OGC request entirely from QUERY_STRING.
        fastcgi_param  QUERY_STRING       $query_string;
        fastcgi_param  REQUEST_METHOD     $request_method;
        fastcgi_param  CONTENT_TYPE       $content_type;
        fastcgi_param  CONTENT_LENGTH     $content_length;
        fastcgi_read_timeout 60s;
    }
}
